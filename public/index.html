<!doctype html>
<html>
<head>
  <meta http-equiv="content-type" content="txt/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha256-L/W5Wfqfa0sdBNIKN9cG6QA5F2qx4qICmU2VgLruv9Y=" crossorigin="anonymous">
  <title>短网址生成器</title>
  <style>
    #result code{color: inherit;}
    .btn-primary{
      background-color: #c2185b;
      border-color: #c2185b;
    }
    .btn-primary:hover{
      background-color: #ad1457;
      border-color: #ad1457;
    }
    * {
      margin: 0;
      padding: 0;
      cursor: default;
    }
    html, body {
      height: 100%;
    }
    body {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: center;
      justify-content: center;
      vertical-align: center;
      flex-wrap: wrap;
      align-content: center;
      color: #2a2b2c;
      background-color: #fff;
      overflow: hidden;
    }
    .card {
      background-color: transparent;
      width: 768px;
    }
    .card-text {
      text-align: center;
    }
    .card-text > a {
      text-decoration: none;
      color: #c2185b;
    }
    .card-text > a {
      cursor: pointer;
    }
    .form-control {
        cursor: auto;
    }
    .form-control:focus{border-color: #c2185b;box-shadow: 0 0 0 0.2rem rgba(194,24,91,.25);}
    #beian a{padding: 0 5px;color: #c2185b;}
    @media (max-width: 769px) {
      .card {
        width: 80%;
      }
    }
    @media (max-width: 420px) {
      .card {
        width: 95%;
      }
    }
    @media (prefers-color-scheme: dark) { 
      body {
        color: #d9d9d9; 
        background: #1b1b1b;
      }
      .card {
        background-color: #3e0019a6;
      }
    } 
  </style>
</head>
<body>
  <div class="card">
    <h5 class="card-header">短网址生成器</h5>
    <div class="card-body">
      <h5 class="card-title">输入原网址：</h5>
      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="例如: https://example.com/" id="text">
        <div class="input-group-append">
          <button class="btn btn-primary" type="button" onclick='shorturl()' id="searchbtn">缩短</button>
        </div>
      </div>
      <p id="notice"></p>             
    </div>
  </div>
  <div id="beian" style="opacity: 0.7;position: absolute;bottom: 10px; margin: 0 20px;text-align: center;"><img src="https://lzc2002.top//medias/icons/beian.png"><a target="_blank" href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44011502001113"><span style="cursor: pointer;">粤公网安备 44011502001113号</span></a><a target="_blank" href="https://beian.miit.gov.cn/"><span style="cursor: pointer;">粤ICP备2023073334号-1</span></a><a target="_blank" href="https://beian.miit.gov.cn/"><span style="cursor: pointer;">粤ICP备2023073334号-2A</span></a><a target="_blank" href="https://beian.miit.gov.cn/"><span style="cursor: pointer;">粤ICP备2023073334号-3K</span></a></div>
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">结果</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="result">无结果</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick='copyurl("result")' data-toggle="popover" data-placement="bottom" data-content="已复制">复制</button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>    
        </div>
      </div>
    </div>
  </div>         
  <script src="https://gcore.jsdelivr.net/npm/jquery@3.4.1/dist/jquery.slim.min.js" integrity="sha256-pasqAKBDmFT4eHoN2ndd6lN370kFiGUFyTiUHWhU7k8=" crossorigin="anonymous"></script>
  <script src="https://gcore.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="https://gcore.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha256-WqU1JavFxSAMcLP2WIOI+GB2zWmShMI82mTpLDcqFUg=" crossorigin="anonymous"></script>
  <script src="/client.js" crossorigin="anonymous"></script>
</body>
</html>
